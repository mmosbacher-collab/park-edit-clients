<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Park Edit — How it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PARK EDIT WALKTHROUGH PLAYER
   Two files deploy together in the same folder:
     park-edit-walkthrough.html  (this file)
     mcarthur-video.html         (interaction-locked copy of the demo)
   Full cut by default. Short cut: ?cut=short
   ============================================================ */
:root{
  --cream:#FDF8F4;--terracotta:#E8734A;--sky:#5B8FA8;--gold:#F2C94C;
  --border:#EDE5DC;--text:#2C2420;--muted:#8C7B72;--surface:#F5EFE8;
  --shadow:#C4A898;--bezel:#2C2420;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--text);}

.band{width:100%;background:var(--cream);padding:24px;}
.stage-outer{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:56px;}
.copy-col{flex:0 1 420px;min-width:0;}
.phone-col{flex:0 0 auto;}

/* stack on narrow screens: text above, phone below */
@media (max-width:900px){
  .band{padding:24px 20px 32px;}
  .stage-outer{flex-direction:column;gap:24px;}
  .copy-col{flex:0 0 auto;max-width:440px;width:100%;text-align:center;}
}

/* ---- phone ----
   DEFAULT = pushed in: no bezel, app fills the frame.
   .wide    = opening establishing shot: bezel visible, scaled down. */
.stage{position:relative;margin:0 auto;display:flex;align-items:center;justify-content:center;}
/* DEFAULT = cropped view: a flat window onto the app, no device chrome at all */
.phone{position:relative;margin:0 auto;box-sizing:border-box;border-radius:0;background:var(--bezel);padding:0;
  box-shadow:none;
  transform-origin:center center;transform:scale(1);
  /* Only transform + shadow animate. fit() sets width/height/padding instantly,
     so animating those fought the resize and clipped the bezel mid-transition. */
  transition:transform 1.2s cubic-bezier(.33,0,.2,1),
             box-shadow 1.2s cubic-bezier(.33,0,.2,1);}
.phone.no-anim,.phone.no-anim *{transition:none !important;}
/* .wide = opening establishing shot: full device, bezel, shadow, rounded */
.phone.wide{transform:scale(.68);padding:10px;border-radius:38px;
  box-shadow:0 18px 50px rgba(44,36,32,.28),0 3px 10px rgba(44,36,32,.18);}
.phone-screen{position:relative;border-radius:0;overflow:hidden;background:var(--cream);}
.phone.wide .phone-screen{border-radius:29px;}
/* the crop: .scaler slides up so the app's branding header sits above the window */
/* these overlay the visible window, so they must not inherit .scaler's crop
   offset — pin them to the screen element instead */
.veil,.endcard,.play-overlay{position:absolute;}
.phone-screen > .veil,.phone-screen > .endcard,.phone-screen > .play-overlay{inset:0;}
.scaler{position:absolute;top:0;left:0;width:390px;transform-origin:top left;}
.app-frame{display:block;width:390px;border:0;background:var(--cream);}

/* ---- Act 1: the Pre-Edit document layer ---- */

/* ---- touch dot ---- */
.dot{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(232,115,74,.42);border:2px solid rgba(232,115,74,.85);left:0;top:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:40;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),transform .28s;}
.dot.visible{transform:translate(-50%,-50%) scale(1);}
.dot.press{transform:translate(-50%,-50%) scale(.62);}

/* ---- closing veil / line / end card ---- */
.veil{position:absolute;inset:0;background:var(--cream);opacity:0;pointer-events:none;transition:opacity 1s;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
.veil.show{opacity:1;pointer-events:auto;}
.closing-line{font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;line-height:1.22;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s;}
.closing-line.show{opacity:1;transform:none;}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .8s;z-index:51;background:var(--cream);}
.endcard.show{opacity:1;pointer-events:auto;}
.ec-mark{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;}
.ec-mark span{color:var(--terracotta);}
.ec-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.ec-cta{display:inline-block;background:var(--terracotta);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:13px 26px;border-radius:14px;box-shadow:3px 3px 0 #C45A2E;margin-top:6px;}
.ec-cta:active{transform:translateY(2px);box-shadow:1px 1px 0 #C45A2E;}
.ec-replay{background:none;border:1.5px solid var(--border);border-radius:14px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;padding:9px 18px;cursor:pointer;}

/* ---- captions: large type beside the phone ---- */
.act-eyebrow{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--terracotta);margin-bottom:18px;opacity:0;transition:opacity .5s;}
.act-eyebrow.show{opacity:1;}
.caption{font-family:'DM Sans',sans-serif;font-size:38px;font-weight:500;line-height:1.22;letter-spacing:-0.02em;color:var(--text);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;}
.caption.show{opacity:1;transform:none;}
.caption .accent{color:var(--terracotta);box-shadow:inset 0 -3px 0 var(--terracotta);}
@media (max-width:900px){ .caption{font-size:30px;} }
@media (max-width:520px){ .caption{font-size:25px;} }


/* ---- play overlay (reduced motion / pre-start) ---- */
.play-overlay{position:absolute;inset:0;z-index:60;background:rgba(253,248,244,.62);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;}
.play-overlay.show{opacity:1;pointer-events:auto;}
.play-btn{width:72px;height:72px;border-radius:50%;border:none;background:var(--terracotta);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(232,115,74,.45);display:flex;align-items:center;justify-content:center;}
.fallback-link{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);}
.fallback-link a{color:var(--terracotta);}
</style>
</head>
<body>

<div class="band">
<div class="stage-outer">
  <div class="copy-col">
    <div class="act-eyebrow" id="eyebrow"></div>
    <div class="caption" id="caption" aria-live="polite"></div>
  </div>
  <div class="phone-col">
  <div class="stage" id="stage">
    <div class="phone wide" id="phone">
      <div class="phone-screen" id="screen">
        <div class="scaler" id="scaler">
          <iframe class="app-frame" id="app" title="The Park Edit demo, animated walkthrough"></iframe>

          <div class="dot" id="dot"></div>
        </div>

        <div class="veil" id="veil"><div class="closing-line" id="closingLine">Go as a parent.<br>Not a planner.</div></div>

        <div class="endcard" id="endcard">
          <div class="ec-mark">The Park.<span>Edit</span></div>
          <div class="ec-sub">disneyparkedit.com</div>
          <!-- ⚠️ VERIFY demo URL before deploy -->
          <a class="ec-cta" href="/mcarthur/">Try the demo</a>
          <button class="ec-replay" id="replayBtn">Watch again</button>
        </div>

        <div class="play-overlay" id="playOverlay">
          <button class="play-btn" id="playBtn" aria-label="Play walkthrough">▶</button>
        </div>
      </div>
    </div>
    <div class="fallback-link" id="fallback" hidden>Prefer to explore yourself? <a href="/mcarthur/">Open the demo</a></div>
    <div style="text-align:center;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--shadow);margin-top:8px;">BUILD 18 · SINGLE FILE</div>
  </div>
  </div>

</div>
</div>

/* ---- responsive scale ----
   DEFAULT is a CROPPED window: the app's branding header is clipped off the
   top so the tab bar becomes the top edge and everything renders larger.
   .wide shows the whole device for the opening establishing shot. */
var PHONE_TARGET = 420;
var cropPx = 128; /* fallback; replaced by a real measurement once the app loads */

function measureCrop(){
  var idoc = cdoc(); if(!idoc) return;
  var hdr = idoc.querySelector(".brand-header");
  if(hdr){
    var rect = hdr.getBoundingClientRect();
    if(rect.height > 0){ cropPx = Math.round(rect.height); }
  }
  fit();
}

function fit(){
  var stacked = window.innerWidth <= 900;
  var avail = stage.parentElement.clientWidth - 24;
  var maxW = Math.min(avail, PHONE_TARGET);
  var budgetH = window.innerHeight * (stacked ? 0.62 : 0.88) - 24;

  var visibleH = APP_H - cropPx;      /* app px shown once cropped */
  var wide = phone.classList.contains("wide");
  /* Wide shows the whole app, cropped shows only visibleH — size to whichever
     is on screen so neither state overflows. */
  var limitH = wide ? APP_H : visibleH;
  var s = Math.min(maxW / APP_W, budgetH / limitH, 1);

  var w = APP_W * s;
  var bezel = wide ? 10 : 0; /* .wide padding, per side */
  /* border-box: declared width includes the bezel, so the column reserves it
     and the screen inside is still exactly w */
  phone.style.width = (w + bezel * 2) + "px";
  phone.style.height = (Math.round(limitH * s) + bezel * 2) + "px";
  screenEl.style.width = w + "px";
  screenEl.style.height = Math.round(limitH * s) + "px";
  scaler.style.transform = "scale(" + s + ")";
  scaler.style.top = (wide ? 0 : -Math.round(cropPx * s)) + "px";
  app.style.height = APP_H + "px";

  /* reserve the taller of the two states so the layout never jumps */
  stage.style.minHeight = Math.round(Math.max(APP_H * 0.68, visibleH) * s) + 24 + "px";
}
window.addEventListener("resize", fit);
fit();

/* Toggling the crop must re-run fit(), since the window height differs
   between states. Centralised so no call site can forget. */
function setWide(on){
  phone.classList.toggle("wide", !!on);
  fit();
}

/* ---- helpers ---- */
var timers = [];
function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function cap(text, accent){
  caption.classList.remove("show");
  timers.push(setTimeout(function(){
    if(accent && text.indexOf(accent) !== -1){
      var i = text.indexOf(accent);
      caption.textContent = "";
      caption.appendChild(document.createTextNode(text.slice(0, i)));
      var span = document.createElement("span");
      span.className = "accent";
      span.textContent = accent;
      caption.appendChild(span);
      caption.appendChild(document.createTextNode(text.slice(i + accent.length)));
    } else {
      caption.textContent = text;
    }
    caption.classList.add("show");
  }, 280));
}
function act(label){
  if(!label){ eyebrow.classList.remove("show"); return; }
  eyebrow.classList.remove("show");
  timers.push(setTimeout(function(){ eyebrow.textContent = label; eyebrow.classList.add("show"); }, 300));
}

function cw(){ return app.contentWindow; }
function cdoc(){ try { return app.contentWindow.document; } catch(e){ return null; } }

/* dot lives inside the scaler, so element coordinates from the iframe
   viewport map 1:1 with no scale math */
function moveDotTo(el, cb){
  var r = el.getBoundingClientRect();
  dot.style.left = (r.left + r.width/2) + "px";
  dot.style.top = (r.top + Math.min(r.height/2, 40)) + "px";
  dot.classList.add("visible");
  if(cb) timers.push(setTimeout(cb, 600));
}
function pressDot(cb){
  dot.classList.add("press");
  timers.push(setTimeout(function(){
    dot.classList.remove("press");
    if(cb) cb();
  }, 260));
}
function hideDot(){ dot.classList.remove("visible","press"); }

function tap(el, action){
  if(!el) { if(action) action(); return; }
  moveDotTo(el, function(){ pressDot(action); });
}

function appScrollToEl(el, offset){
  if(!el) return;
  var w = cw();
  /* When cropped, the top cropPx of the app is hidden behind the window edge,
     so targets must sit that much further down to stay visible. */
  var hidden = phone.classList.contains("wide") ? 0 : cropPx;
  var top = el.getBoundingClientRect().top + w.scrollY - (offset == null ? 90 : offset) - hidden;
  w.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}
function findByText(root, sel, text){
  if(!root) return null;
  var nodes = root.querySelectorAll(sel), best = null;
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].textContent.indexOf(text) !== -1){
      if(!best || nodes[i].textContent.length < best.textContent.length) best = nodes[i];
    }
  }
  return best;
}
function smoothScroll(container, to, dur){
  var from = container.scrollTop, start = null;
  function step(ts){
    if(start === null) start = ts;
    var p = Math.min(1, (ts - start) / dur);
    var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    container.scrollTop = from + (to - from) * e;
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* simulated drag: tiki row moves above small world */
function simulateDrag(){
  var d = cdoc(); if(!d) return;
  var tiki = d.getElementById("d0-tiki");
  var small = d.getElementById("d0-smallworld");
  if(!tiki || !small) return;
  var handle = tiki.querySelector(".drag-handle") || tiki;
  moveDotTo(handle, function(){
    dot.classList.add("press");
    var dy = small.getBoundingClientRect().top - tiki.getBoundingClientRect().top;
    tiki.style.transition = "transform .7s cubic-bezier(.4,0,.2,1)";
    small.style.transition = "transform .7s cubic-bezier(.4,0,.2,1)";
    tiki.style.position = "relative"; tiki.style.zIndex = "5";
    tiki.style.transform = "translateY(" + dy + "px)";
    small.style.transform = "translateY(" + (-tiki.offsetHeight) + "px)";
    dot.style.top = (parseFloat(dot.style.top) + dy) + "px";
    timers.push(setTimeout(function(){
      tiki.style.transition = ""; small.style.transition = "";
      tiki.style.transform = ""; small.style.transform = "";
      tiki.style.position = ""; tiki.style.zIndex = "";
      small.parentNode.insertBefore(small, tiki);
      dot.classList.remove("press");
      timers.push(setTimeout(hideDot, 400));
    }, 750));
  });
}

var started = false, appReady = false;

function resetVisuals(){
  clearTimers();
  veil.classList.remove("show");
  closingLine.classList.remove("show");
  endcard.classList.remove("show");
  caption.classList.remove("show");
  eyebrow.classList.remove("show");
  /* snap back to the establishing shot without animating backwards */
  phone.classList.add("no-anim");
  setWide(true);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ phone.classList.remove("no-anim"); });
  });
  hideDot();
  /* premierCard lives inside the iframe, not this document */
  var idoc = cdoc();
  var pc = idoc && idoc.getElementById("premierCard");
  if(pc) pc.classList.remove("hero-hold");
}

function play(){
  resetVisuals();
  playOverlay.classList.remove("show");
  (isShort ? shortCut : fullCut)();
}

function replay(){
  resetVisuals();
  playOverlay.classList.remove("show");
  started = false; appReady = false; appLoadHandled = false;
  app.addEventListener("load", onAppLoad, { once: true });
  app.srcdoc = appHTML();
}

var appLoadHandled = false;
function onAppLoad(){
  if(appLoadHandled) return;
  appLoadHandled = true;
  /* a 404 page still fires load, so verify the app itself is present */
  var ok = false, blocked = false;
  try { ok = typeof app.contentWindow.openDrawer === "function"; }
  catch(e){ ok = false; blocked = true; }
  if(!ok){
    document.getElementById("fallback").hidden = false;
    var err = document.createElement("div");
    err.style.cssText = "position:absolute;inset:0;z-index:70;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:14px;line-height:1.7;color:var(--muted);";
    err.textContent = blocked
      ? "This browser blocked the embedded demo. Try serving the page over HTTP, or a different browser."
      : "The embedded demo didn't initialize. Refresh the page; if it persists, send Claude a screenshot.";
    screenEl.appendChild(err);
    return;
  }
  appReady = true;
  /* Measure the real header height now the app has rendered. Fonts can shift
     it, so measure again once they've settled rather than trusting one read. */
  measureCrop();
  try {
    if(app.contentDocument && app.contentDocument.fonts && app.contentDocument.fonts.ready){
      app.contentDocument.fonts.ready.then(measureCrop);
    }
  } catch(e){ /* cross-origin guard; the fallback value stands */ }
  maybeStart();
}

function maybeStart(){
  if(started || !appReady) return;
  playOverlay.classList.add("show");
  if(reducedMotion){
    document.getElementById("fallback").hidden = false;
    return;
  }
  if(inView){ started = true; timers.push(setTimeout(play, 400)); }
}

var inView = false;
var io = new IntersectionObserver(function(entries){
  inView = entries[0].isIntersecting && entries[0].intersectionRatio >= 0.25;
  maybeStart();
}, { threshold: [0, 0.25, 1] });
io.observe(stage);

playBtn.addEventListener("click", function(){ started = true; play(); });
replayBtn.addEventListener("click", replay);
app.addEventListener("load", onAppLoad, { once: true });
app.srcdoc = appHTML();
})();
</script>
